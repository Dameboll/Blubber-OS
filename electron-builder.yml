# electron-builder.yml
#
# Windows NSIS installer only. Mac/Linux targets and auto-update are out of
# scope. Native modules ARE rebuilt against Electron's ABI for packaged builds
# (see electron/main.js header + scripts/electron-rebuild.mjs) -- the packaged
# app is self-contained and needs no system Node.js.
#
# KNOWN LAUNCH GAP: the produced .exe is UNSIGNED. Windows SmartScreen shows an
# "unrecognized app" warning that the buyer must click through (More info > Run
# anyway). Fixing this needs an Authenticode code-signing certificate (OV ~$200/yr,
# or EV for instant SmartScreen reputation) wired in via a `win.certificateFile`
# + CSC_KEY_PASSWORD, or an Azure Trusted Signing account.
#
# `files` is an explicit exclude list layered on electron-builder's default
# "**/*" (all patterns here start with `!`, so the default is preserved --
# see electron-builder docs on `files`). A first real build attempt proved
# the plain default isn't safe to leave alone: this project directory also
# accumulates large/transient dev-only trees next to the app source --
# multiple Next.js cache dirs (.next dev cache, .next-build production
# output that DOES ship, .next-soak/.next-verify from separate
# load-test/verify tooling), test artifacts, and unrelated scaffolding
# (supabase/) that has nothing to do with this Electron app. Packaging
# "**/*" unfiltered pulled in a mid-write webpack cache file from a
# concurrently-running process and crashed with ENOENT, and would
# otherwise have shipped gigabytes of irrelevant dev cruft (and, worse,
# the developer's own live local databases under data/) inside the
# installer. Every exclude below is a directory the packaged app does not
# read from at runtime -- server.js/src recreate data/ and music/ fresh on
# first run (see src/server/pet-store.ts, quest-store.ts,
# src/app/api/tracks/route.ts).
#
# asarUnpack below is the other override that matters: better-sqlite3 and
# node-pty ship native .node binaries that cannot be loaded from inside
# app.asar, so they're kept as real files on disk.

appId: com.dameos.blubber
productName: Blubber

# asar MUST be false. electron/main.js spawns the real server.js as a child
# process (Electron-as-node) and Next.js reads its production build (.next-build),
# src/, and node_modules from real files on disk at runtime — none of that works
# from inside an app.asar archive, and getAppRoot() points the child's cwd at a
# real resources/app/ directory that only exists when asar is off. With asar on
# (the electron-builder default), the packaged app throws ENOENT spawning the
# server and the window never loads.
asar: false

directories:
  output: dist-electron
  buildResources: build

files:
  - "!.next/**"
  # .remember/ is a dev session-memory tool that writes/deletes a transient
  # tmp/save.lock mid-run; electron-builder's glob raced it and crashed with
  # ENOENT. Never part of the shipped app.
  - "!.remember/**"
  - "!.claude-session/**"
  - "!.claude/**"
  - "!.playwright-mcp/**"
  - "!docs/**"
  - "!.next-soak/**"
  - "!.next-verify/**"
  # Next's on-disk build cache — ~280 MiB of webpack/turbopack intermediates
  # the production server never reads. Shipping it tripled installer size.
  - "!.next-build/cache/**"
  # Dev-only TypeScript route stubs (typed-routes support) — never loaded at
  # runtime, and they embed the build machine's absolute source paths.
  - "!.next-build/types/**"
  - "!dist-electron/**"
  - "!data/**"
  - "!music/**"
  - "!logs/**"
  - "!e2e/**"
  - "!test-results/**"
  - "!playwright-report/**"
  - "!blob-report/**"
  - "!scripts/**"
  - "!supabase/**"
  # Dev/test tooling and metadata with no runtime role. tools/ holds the
  # clean-machine smoke-test harness; .env.local ships nothing secret TODAY
  # but packaging it at all is a standing secret-leak risk (.env.example
  # documents the public values instead). NOTE: src/ deliberately STAYS in
  # the package — server.js loads src/server/*.ts through ts-node at runtime
  # (pty-manager, data-migrate), so excluding source would break the app.
  - "!tools/**"
  - "!.env.local"
  - "!.env*.local"
  - "!tsconfig.tsbuildinfo"
  - "!BLUBBER-LAUNCH-READINESS-AUDIT-AND-PLAN.md"
  - "!package-lock.json"

# electron-builder defaults to rebuilding native deps (better-sqlite3,
# node-pty) against Electron's own ABI before packaging (via
# @electron/rebuild + node-gyp). That rebuild is unnecessary here and
# fails hard on any machine without a native build toolchain (Visual
# Studio Build Tools on Windows) -- electron/main.js spawns the app's
# server.js with the system `node` on PATH by default (see main.js file
# header), not Electron's bundled runtime, so the native modules only
# ever need to match the system Node ABI they were already built/
# prebuild-installed against during a normal `npm install`. Only flip
# this back on if BLUBBER_ELECTRON_SPAWN_AS_NODE=1 becomes the shipped
# default and a build toolchain is guaranteed present.
npmRebuild: false

asarUnpack:
  - node_modules/better-sqlite3/**/*
  - node_modules/node-pty/**/*

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
